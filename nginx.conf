server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Einseiten-App: alles, was keine Datei ist, geht an die index.html.
    # Noch gibt es kein Routing, aber sobald eins dazukommt, funktioniert
    # ein direkt aufgerufener Pfad damit ohne weitere Aenderung.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite haengt einen Hash an jeden Asset-Dateinamen, die duerfen also
    # unbegrenzt gecacht werden. Die index.html ausdruecklich nicht – sonst
    # zeigt der Browser nach einem Deploy weiter die alte Version.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
